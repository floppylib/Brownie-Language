; This config file holds configuration information about the Brownie compiler
; and project.

[Project]
Name: "Brownie"
Version: "$version"
Platforms: """
  windows: i386;amd64
  linux: i386;hppa;ia64;alpha;amd64;powerpc64;arm;sparc;sparc64;s390x;m68k;mips;mipsel;mips64;mips64el;powerpc;powerpc64el;arm64;riscv32;riscv64;loongarch64
  macosx: i386;amd64;powerpc64;arm64
  solaris: i386;amd64;sparc;sparc64
  illumos: i386;amd64;sparc;sparc64;arm64
  freebsd: i386;amd64;powerpc64;arm;arm64;riscv64;sparc64;mips;mipsel;mips64;mips64el;powerpc;powerpc64el
  netbsd: i386;amd64;arm64
  openbsd: i386;amd64;arm;arm64
  dragonfly: i386;amd64
  crossos: amd64
  haiku: i386;amd64
  android: i386;arm;arm64
  nintendoswitch: arm64
"""

Authors: "Andreas Rumpf"
Description: """This is the Brownie Compiler. Brownie is a new statically typed,
imperative programming language, that supports procedural, functional, object
oriented and generic programming styles while remaining simple and efficient.
A special feature that Brownie inherited from Lisp is that Brownie's abstract
syntax tree (AST) is part of the specification - this allows a powerful macro
system which can be used to create domain specific languages.

Brownie is a compiled, garbage-collected systems programming language
which has an excellent productivity/performance ratio. Brownie's design
focuses on the 3E: efficiency, expressiveness, elegance (in the order of
priority)."""

App: Console
License: "copying.txt"

[Config]
Files: "config/*.cfg"
Files: "config/config.nims"

[Documentation]
; Files: "doc/*.html"
; Files: "doc/*.cfg"
; Files: "doc/*.pdf"
; Files: "doc/*.ini"
Files: "doc/html/overview.html"
Start: "doc/html/overview.html"


[Other]
Files: "copying.txt"
Files: "kitten.brownie"

Files: "icons/brownie.ico"
Files: "icons/brownie.rc"
Files: "icons/brownie.res"
Files: "icons/nim_icon.o"
Files: "icons/kitten.ico"
Files: "icons/kitten.rc"
Files: "icons/kitten.res"
Files: "icons/koch_icon.o"

Files: "compiler"
Files: "doc"
Files: "doc/html"
Files: "tools"
Files: "tools/debug/brownie-gdb.py"
Files: "browniepretty"
Files: "testament"
Files: "browniesuggest"
Files: "browniesuggest/tests/*.brownie"
Files: "changelogs/*.md"
Files: "ci/funs.sh"

[Lib]
Files: "lib"

[Other]
Files: "examples"
Files: "dist/nimble"
Files: "dist/checksums"
Files: "dist/nimony"

Files: "tests"

[Windows]
Files: "bin/brownie.exe"
Files: "bin/browniegrep.exe"
Files: "bin/browniesuggest.exe"
Files: "bin/nimble.exe"
Files: "bin/vccexe.exe"
Files: "bin/nimgrab.exe"
Files: "bin/browniepretty.exe"
Files: "bin/testament.exe"
Files: "bin/brownie-gdb.bat"
Files: "bin/atlas.exe"

Files: "kitten.exe"
Files: "finish.exe"
; Files: "bin/downloader.exe"

; Files: "dist/mingw"
Files: r"tools\start.bat"
BinPath: r"bin;dist\mingw\bin;dist"

;           Section | dir | zipFile | size hint (in KB) | url | exe start menu entry
Download: r"Documentation|doc|docs.zip|13824|https://brownie-lang.org/download/docs-${version}.zip|overview.html"
Download: r"C Compiler (MingW)|dist|mingw.zip|82944|https://brownie-lang.org/download/${mingw}.zip"
Download: r"Support DLLs|bin|nim_dlls.zip|479|https://brownie-lang.org/download/dlls.zip"
Download: r"Aporia Text Editor|dist|aporia.zip|97997|https://brownie-lang.org/download/aporia-0.4.0.zip|aporia-0.4.0\bin\aporia.exe"
; for now only NSIS supports optional downloads

[WinBin]
Files: "bin/makelink.exe"
Files: "bin/7zG.exe"
Files: "bin/*.dll"
Files: "bin/cacert.pem"

[UnixBin]
Files: "bin/brownie"


[Unix]
InstallScript: "yes"
UninstallScript: "yes"
Files: "bin/brownie-gdb"
Files: "build_all.sh"


[InnoSetup]
path = r"c:\Program Files (x86)\Inno Setup 5\iscc.exe"
flags = "/Q"

[NSIS]
flags = "/V0"

[C_Compiler]
path = r""
flags = "-w"


[deb]
buildDepends: "gcc (>= 4:4.3.2)"
pkgDepends: "gcc (>= 4:4.3.2)"
shortDesc: "The Brownie Compiler"
licenses: "bin/brownie,MIT;lib/*,MIT;"

[nimble]
pkgName: "brownie"
pkgFiles: "compiler/*;doc/basicopt.txt;doc/advopt.txt;doc/browniedoc.css;doc/browniedoc.cls"
